spring.application.name=cropmonitoring

# Development Database (H2 in-memory database) - Commented out for AWS migration
# spring.datasource.url=jdbc:h2:mem:crop_db;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 console (optional, available at /h2-console)
# spring.h2.console.enabled=true

# AWS RDS Database Configuration (MySQL)
# These use environment variables with fallback defaults for local development
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:crop_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Set server port if needed (default is 8080)
server.port=8080

# Disable OSIV to prevent SSE from holding database connections open forever
spring.jpa.open-in-view=false
